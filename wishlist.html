<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved | BHAKSHI</title>
  <meta name="description" content="The BHAKSHI tees you've saved for later — kept on this device, no account needed.">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/features.css">
  <link rel="icon" href="images/favicon.svg">
</head>
<body data-page="wishlist">
  <main id="main" class="wl">
    <section class="wl-hero">
      <div class="container">
        <p class="wl-eyebrow mono">[ Wishlist ] <span>· no login, no account</span></p>
        <h1 class="wl-title"><span class="wl-word">Saved</span> <span class="wl-num mono" id="wl-num">(00)</span></h1>
        <div class="wl-bar">
          <p class="wl-count mono" id="wl-count" aria-live="polite">&nbsp;</p>
          <div class="wl-actions">
            <a class="btn btn-wa btn-sm wl-share" id="wl-share" href="#" target="_blank" rel="noopener" hidden>
              <svg viewBox="0 0 32 32" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6a10.6 10.6 0 0 1-5.4-1.5l-.4-.2-3.9 1 1-3.8-.2-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7 0a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.7 3.7 0 0 0-1.1 2.7 6.4 6.4 0 0 0 1.3 3.4 14.7 14.7 0 0 0 5.6 5c2.1.9 2.9 1 4 .8a3.4 3.4 0 0 0 2.2-1.6 2.8 2.8 0 0 0 .2-1.6c-.1-.1-.3-.2-.6-.4z"/></svg>
              <span>Share list</span>
            </a>
            <a class="btn btn-ghost btn-sm wl-ask" id="wl-ask" href="#" target="_blank" rel="noopener" hidden>Ask us on WhatsApp</a>
          </div>
        </div>
      </div>
    </section>

    <section class="wl-body" id="wl-full" hidden>
      <div class="container">
        <div class="grid-products wl-grid" id="wl-grid"></div>
      </div>
    </section>

    <section class="wl-empty" id="wl-empty" hidden>
      <div class="container">
        <div class="wl-empty-head">
          <div class="wl-empty-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.4 7.6 3.6 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.6 0 5.8 3.6 4.5 7.1-1.8 4.8-9.3 9.4-9.3 9.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </div>
          <div class="wl-empty-copy">
            <h2 class="wl-empty-title">Nothing saved yet</h2>
            <p class="wl-empty-text">Tap the heart on any tee and it waits here — on this phone, no account needed. Units are limited, so don't sit on it too long.</p>
            <a class="btn btn-lg" href="shop.html" data-magnetic>Shop the drop</a>
          </div>
        </div>
        <div class="wl-more-head">
          <p class="eyebrow mono" id="wl-suggest-eyebrow">[ Start here ]</p>
          <h3 class="wl-more-title" id="wl-suggest-title">The drop</h3>
        </div>
        <div class="grid-products wl-suggest" id="wl-suggest"></div>
      </div>
    </section>

    <section class="wl-more" id="wl-more" hidden></section>
  </main>
  <script src="js/products.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
  <script src="js/features.js"></script>
</body>
</html>
