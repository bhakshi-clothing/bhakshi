<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist | BHAKSHI</title>
  <meta name="description" content="The BHAKSHI pieces you've saved for later. Kept on this device, no account needed.">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/features.css">
  <link rel="icon" href="images/favicon.svg">
</head>
<body data-page="wishlist">
  <main id="main" class="wl">
    <section class="wl-head">
      <div class="container">
        <h1 class="wl-title" id="wl-title">Wishlist</h1>
        <p class="wl-count" id="wl-count" aria-live="polite" hidden></p>
        <div class="wl-actions" id="wl-actions" hidden>
          <a class="wl-share link-underline" id="wl-share" href="#" target="_blank" rel="noopener">Share list</a>
          <a class="wl-ask link-underline" id="wl-ask" href="#" target="_blank" rel="noopener" hidden>Ask us on WhatsApp</a>
        </div>
      </div>
    </section>

    <section class="wl-body" id="wl-full" hidden>
      <div class="container">
        <div class="grid-products wl-grid" id="wl-grid"></div>
      </div>
    </section>

    <section class="wl-empty" id="wl-empty" hidden>
      <div class="container">
        <div class="wl-empty-box">
          <p class="wl-empty-title">Your wishlist is empty</p>
          <p class="wl-empty-text">Tap the heart on any piece to save it here. No account needed.</p>
          <a class="btn" href="shop.html">Continue shopping</a>
        </div>
        <div class="wl-sec-head">
          <h2 class="wl-sec-title" id="wl-suggest-title">The drop</h2>
          <a class="link-underline wl-sec-link" href="shop.html">View all</a>
        </div>
        <div class="grid-products" id="wl-suggest"></div>
      </div>
    </section>

    <section class="wl-more" id="wl-more" hidden></section>
  </main>
  <script src="js/products.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
  <script src="js/features.js"></script>
</body>
</html>
