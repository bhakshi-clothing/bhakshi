<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- BHAKSHI block-print motif: dotted jaal lattice, eight-petal buti, corner buds -->
  <defs>
    <path id="pt" d="M0 -4C-3.2 -8 -3.4 -13 0 -17C3.4 -13 3.2 -8 0 -4Z"/>
    <path id="ps" d="M0 -4C-2 -6.6 -2.2 -9.6 0 -12C2.2 -9.6 2 -6.6 0 -4Z"/>
    <g id="bud">
      <path d="M0 -3C-2.4 -6 -2.4 -9 0 -11C2.4 -9 2.4 -6 0 -3Z" transform="rotate(45)"/>
      <path d="M0 -3C-2.4 -6 -2.4 -9 0 -11C2.4 -9 2.4 -6 0 -3Z" transform="rotate(135)"/>
      <path d="M0 -3C-2.4 -6 -2.4 -9 0 -11C2.4 -9 2.4 -6 0 -3Z" transform="rotate(225)"/>
      <path d="M0 -3C-2.4 -6 -2.4 -9 0 -11C2.4 -9 2.4 -6 0 -3Z" transform="rotate(315)"/>
      <circle r="1.8"/>
    </g>
  </defs>
  <g fill="#d9772b">
    <!-- lattice -->
    <path d="M40 1L79 40L40 79L1 40Z" fill="none" stroke="#d9772b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0 4.2"/>
    <!-- central buti -->
    <g transform="translate(40 40)">
      <use href="#pt"/><use href="#pt" transform="rotate(90)"/><use href="#pt" transform="rotate(180)"/><use href="#pt" transform="rotate(270)"/>
      <use href="#ps" transform="rotate(45)"/><use href="#ps" transform="rotate(135)"/><use href="#ps" transform="rotate(225)"/><use href="#ps" transform="rotate(315)"/>
      <circle r="3.2" fill="none" stroke="#d9772b" stroke-width="1.4"/><circle r="1.1"/>
    </g>
    <!-- corner buds (complete when tiled) -->
    <use href="#bud"/><use href="#bud" x="80"/><use href="#bud" y="80"/><use href="#bud" x="80" y="80"/>
    <!-- lattice knots -->
    <circle cx="40" cy="0" r="2.2"/><circle cx="40" cy="80" r="2.2"/><circle cx="0" cy="40" r="2.2"/><circle cx="80" cy="40" r="2.2"/>
  </g>
</svg>
